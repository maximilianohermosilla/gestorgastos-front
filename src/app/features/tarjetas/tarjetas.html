<div class="mx-auto max-w-[1000px] p-6">
  <div class="mb-5 flex flex-wrap items-center justify-between gap-4">
    <h1 class="text-2xl font-semibold">Tarjetas</h1>
    <button mat-flat-button color="primary" (click)="abrir()">
      <mat-icon>add</mat-icon>
      <span>Nueva tarjeta</span>
    </button>
  </div>

  @if (loading()) {
    <div class="flex justify-center py-8">
      <mat-progress-spinner mode="indeterminate" diameter="40" />
    </div>
  } @else if (!items().length) {
    <mat-card>
      <app-empty-state icon="credit_card" message="No hay tarjetas. Creá una para asociarla a tus cuentas." />
    </mat-card>
  } @else {
    <mat-card>
      <table mat-table [dataSource]="paged()" class="w-full">
        <ng-container matColumnDef="numero">
          <th mat-header-cell *matHeaderCellDef>Número</th>
          <td mat-cell *matCellDef="let item">{{ item.numero ?? '—' }}</td>
        </ng-container>

        <ng-container matColumnDef="banco">
          <th mat-header-cell *matHeaderCellDef>Banco</th>
          <td mat-cell *matCellDef="let item">{{ item.bancoNombre ?? '—' }}</td>
        </ng-container>

        <ng-container matColumnDef="tipo">
          <th mat-header-cell *matHeaderCellDef>Tipo</th>
          <td mat-cell *matCellDef="let item">{{ item.tipoTarjetaNombre ?? '—' }}</td>
        </ng-container>

        <ng-container matColumnDef="vencimiento">
          <th mat-header-cell *matHeaderCellDef>Vencimiento</th>
          <td mat-cell *matCellDef="let item">{{ item.vencimiento ?? '—' }}</td>
        </ng-container>

        <ng-container matColumnDef="estado">
          <th mat-header-cell *matHeaderCellDef>Estado</th>
          <td mat-cell *matCellDef="let item">
            @if (item.habilitado) {
              <span class="rounded-full bg-accent/15 px-2 py-0.5 text-xs font-medium text-mist-100">Activa</span>
            } @else {
              <span class="rounded-full bg-white/5 px-2 py-0.5 text-xs font-medium text-mist-200">Inactiva</span>
            }
          </td>
        </ng-container>

        <ng-container matColumnDef="acciones">
          <th mat-header-cell *matHeaderCellDef class="w-36 whitespace-nowrap text-right">Acciones</th>
          <td mat-cell *matCellDef="let item" class="whitespace-nowrap text-right">
            <div class="flex flex-nowrap items-center justify-end gap-0.5">
              <button mat-icon-button (click)="abrir(item)" aria-label="Editar">
                <mat-icon class="!text-accent">edit</mat-icon>
              </button>
              <button mat-icon-button (click)="eliminar(item)" aria-label="Eliminar">
                <mat-icon class="!text-expense">delete</mat-icon>
              </button>
            </div>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="columnas"></tr>
        <tr mat-row *matRowDef="let row; columns: columnas"></tr>
      </table>
      <mat-paginator
        [length]="items().length"
        [pageSize]="pageSize()"
        [pageIndex]="pageIndex()"
        [pageSizeOptions]="[5, 10, 25, 50]"
        (page)="onPage($event)"
      ></mat-paginator>
    </mat-card>
  }
</div>
