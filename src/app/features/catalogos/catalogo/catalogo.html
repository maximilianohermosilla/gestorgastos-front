<div class="mx-auto max-w-[900px] p-4 sm:p-6">
  <div class="mb-5 flex flex-wrap items-center justify-between gap-4">
    <div>
      <h1 class="text-2xl font-bold tracking-tight">{{ config().titulo }}</h1>
      <p class="text-sm text-mist-200">Catálogos base del sistema.</p>
    </div>
    <button mat-flat-button color="primary" (click)="abrir()">
      <mat-icon>add</mat-icon>
      <span>Nuevo</span>
    </button>
  </div>

  @if (loading()) {
    <div class="flex justify-center py-8">
      <mat-progress-spinner mode="indeterminate" diameter="40" />
    </div>
  } @else if (!items().length) {
    <mat-card>
      <app-empty-state icon="list" message="No hay registros. Usá el botón «Nuevo» para crear uno." />
    </mat-card>
  } @else {
    <mat-card>
      <div class="overflow-x-auto"><table mat-table [dataSource]="paged()" class="w-full min-w-[680px]">
        <ng-container matColumnDef="nombre">
          <th mat-header-cell *matHeaderCellDef>Nombre</th>
          <td mat-cell *matCellDef="let item">{{ item.nombre }}</td>
        </ng-container>

        <ng-container matColumnDef="acciones">
          <th mat-header-cell *matHeaderCellDef class="w-36 whitespace-nowrap !text-center">Acciones</th>
          <td mat-cell *matCellDef="let item" class="whitespace-nowrap text-center">
            <div class="flex flex-nowrap items-center justify-center gap-0.5">
              <button mat-icon-button (click)="abrir(item)" aria-label="Editar">
                <mat-icon class="!text-accent">edit</mat-icon>
              </button>
              <button mat-icon-button (click)="eliminar(item)" aria-label="Eliminar">
                <mat-icon class="!text-expense">delete</mat-icon>
              </button>
            </div>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="columnas"></tr>
        <tr mat-row *matRowDef="let row; columns: columnas"></tr>
      </table></div>
      <mat-paginator
        [length]="items().length"
        [pageSize]="pageSize()"
        [pageIndex]="pageIndex()"
        [pageSizeOptions]="[5, 10, 25, 50]"
        (page)="onPage($event)"
      ></mat-paginator>
    </mat-card>
  }
</div>
