<div class="mx-auto max-w-[1400px] p-6">
  <div class="mb-5">
    <h1 class="text-2xl font-semibold">Mi perfil</h1>
  </div>

  @if (usuario(); as u) {
    <div class="grid grid-cols-[repeat(auto-fit,minmax(320px,1fr))] gap-4">
      <mat-card>
        <mat-card-header>
          <mat-card-title>Datos de la cuenta</mat-card-title>
        </mat-card-header>
        <mat-card-content>
          <div class="flex items-center gap-3 py-2">
            <mat-icon class="text-accent">badge</mat-icon>
            <span>{{ u.nombre }}</span>
          </div>
          <div class="flex items-center gap-3 py-2">
            <mat-icon class="text-accent">person</mat-icon>
            <span>{{ u.login }}</span>
          </div>
          @if (u.correo) {
            <div class="flex items-center gap-3 py-2">
              <mat-icon class="text-accent">mail</mat-icon>
              <span>{{ u.correo }}</span>
            </div>
          }
        </mat-card-content>
      </mat-card>

      <mat-card>
        <mat-card-header>
          <mat-card-title>Cambiar contraseña</mat-card-title>
        </mat-card-header>
        <mat-card-content>
          <form [formGroup]="passwordForm" (ngSubmit)="changePassword()" class="flex flex-col gap-2 pt-2">
            <mat-form-field appearance="outline">
              <mat-label>Contraseña actual</mat-label>
              <input matInput type="password" formControlName="password" autocomplete="current-password" />
            </mat-form-field>
            <mat-form-field appearance="outline">
              <mat-label>Nueva contraseña</mat-label>
              <input matInput type="password" formControlName="passwordNew" autocomplete="new-password" />
              @if (passwordForm.controls.passwordNew.hasError('minlength')) {
                <mat-error>Mínimo 5 caracteres</mat-error>
              }
            </mat-form-field>
            <button mat-flat-button color="primary" type="submit" [disabled]="savingPassword()">
              Guardar
            </button>
          </form>
        </mat-card-content>
      </mat-card>
    </div>
  }
</div>
