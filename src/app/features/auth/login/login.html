<div class="flex min-h-screen items-center justify-center p-4">
  <mat-card class="w-full max-w-sm">
    <div class="flex flex-col items-center gap-1 px-6 pt-6 text-center">
      <mat-icon class="!h-14 !w-14 !text-5xl text-accent">savings</mat-icon>
      <h1 class="text-2xl font-semibold">Gestor de Gastos</h1>
      <p class="text-sm text-mist-200">Ingresá para administrar tus finanzas</p>
    </div>

    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="submit()" class="mt-4 flex flex-col gap-3">
        <mat-form-field appearance="outline">
          <mat-label>Usuario</mat-label>
          <mat-icon matPrefix>person</mat-icon>
          <input matInput formControlName="login" autocomplete="username" />
          @if (form.controls.login.hasError('required')) {
            <mat-error>Ingrese su usuario</mat-error>
          }
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Contraseña</mat-label>
          <mat-icon matPrefix>lock</mat-icon>
          <input
            matInput
            [type]="hidePassword ? 'password' : 'text'"
            formControlName="password"
            autocomplete="current-password"
          />
          <button
            mat-icon-button
            matSuffix
            type="button"
            tabindex="-1"
            (click)="hidePassword = !hidePassword"
            aria-label="Mostrar contraseña"
          >
            <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
          @if (form.controls.password.hasError('required')) {
            <mat-error>Ingrese su contraseña</mat-error>
          }
        </mat-form-field>

        @if (error()) {
          <p class="text-sm text-expense">{{ error() }}</p>
        }

        <button mat-flat-button color="primary" type="submit" [disabled]="loading()" class="w-full">
          {{ loading() ? 'Ingresando…' : 'Ingresar' }}
        </button>
      </form>
    </mat-card-content>
  </mat-card>
</div>
