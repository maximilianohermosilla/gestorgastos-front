<h2 mat-dialog-title>{{ data.titulo }}</h2>
<mat-dialog-content>
  @if (!data.registros.length) {
    <p class="text-mist-200">No hay cuotas registradas.</p>
  } @else {
    <table mat-table [dataSource]="data.registros" class="w-full">
      <ng-container matColumnDef="numero">
        <th mat-header-cell *matHeaderCellDef>Cuota</th>
        <td mat-cell *matCellDef="let item">{{ item.numeroCuota ?? '—' }}</td>
      </ng-container>

      <ng-container matColumnDef="fecha">
        <th mat-header-cell *matHeaderCellDef>Fecha</th>
        <td mat-cell *matCellDef="let item">{{ item.fecha | dateShort }}</td>
      </ng-container>

      <ng-container matColumnDef="descripcion">
        <th mat-header-cell *matHeaderCellDef>Descripción</th>
        <td mat-cell *matCellDef="let item">{{ item.descripcion }}</td>
      </ng-container>

      <ng-container matColumnDef="valor">
        <th mat-header-cell *matHeaderCellDef>Valor</th>
        <td mat-cell *matCellDef="let item">{{ item.valor | money }}</td>
      </ng-container>

      <ng-container matColumnDef="pagado">
        <th mat-header-cell *matHeaderCellDef class="text-center">Pagado</th>
        <td mat-cell *matCellDef="let item" class="text-center">
          <mat-icon [class.text-accent]="item.pagado">
            {{ item.pagado ? 'check_circle' : 'radio_button_unchecked' }}
          </mat-icon>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="columnas"></tr>
      <tr mat-row *matRowDef="let row; columns: columnas"></tr>
    </table>
  }
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>Cerrar</button>
</mat-dialog-actions>
