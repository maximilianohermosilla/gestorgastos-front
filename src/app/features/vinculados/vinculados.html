<div class="mx-auto max-w-[1000px] p-6">
  <div class="mb-5 flex flex-wrap items-center justify-between gap-4">
    <h1 class="text-2xl font-semibold">Gastos en cuotas</h1>
    <button mat-flat-button color="primary" (click)="abrir()">
      <mat-icon>add</mat-icon>
      <span>Nuevo gasto en cuotas</span>
    </button>
  </div>

  <mat-form-field appearance="outline" class="mb-4 w-full max-w-sm">
    <mat-label>Buscar</mat-label>
    <input matInput (input)="onSearch($event)" placeholder="Descripción" />
  </mat-form-field>

  @if (loading()) {
    <div class="flex justify-center py-8">
      <mat-progress-spinner mode="indeterminate" diameter="40" />
    </div>
  } @else if (!filtered().length) {
    <mat-card>
      <app-empty-state icon="receipt" message="No hay gastos en cuotas." />
    </mat-card>
  } @else {
    <mat-card>
      <table mat-table [dataSource]="filtered()" class="w-full">
        <ng-container matColumnDef="descripcion">
          <th mat-header-cell *matHeaderCellDef>Descripción</th>
          <td mat-cell *matCellDef="let item">{{ item.descripcion }}</td>
        </ng-container>

        <ng-container matColumnDef="cuotas">
          <th mat-header-cell *matHeaderCellDef class="text-center">Cuotas</th>
          <td mat-cell *matCellDef="let item" class="text-center">{{ item.cuotas }}</td>
        </ng-container>

        <ng-container matColumnDef="valorFinal">
          <th mat-header-cell *matHeaderCellDef>Total</th>
          <td mat-cell *matCellDef="let item">{{ item.valorFinal | money }}</td>
        </ng-container>

        <ng-container matColumnDef="valorCuota">
          <th mat-header-cell *matHeaderCellDef>Por cuota</th>
          <td mat-cell *matCellDef="let item">{{ valorCuota(item) | money }}</td>
        </ng-container>

        <ng-container matColumnDef="acciones">
          <th mat-header-cell *matHeaderCellDef class="w-32 text-right">Acciones</th>
          <td mat-cell *matCellDef="let item" class="text-right">
            <button mat-icon-button (click)="verCuotas(item)" aria-label="Ver cuotas">
              <mat-icon>visibility</mat-icon>
            </button>
            <button mat-icon-button (click)="abrir(item)" aria-label="Editar">
              <mat-icon>edit</mat-icon>
            </button>
            <button mat-icon-button color="warn" (click)="eliminar(item)" aria-label="Eliminar">
              <mat-icon>delete</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="columnas"></tr>
        <tr mat-row *matRowDef="let row; columns: columnas"></tr>
      </table>
    </mat-card>
  }
</div>
