<h2 mat-dialog-title>
  {{ data.titulo }}
  @if (periodoTexto()) {
    <span class="block pt-1 text-sm font-normal text-mist-200">Periodo: {{ periodoTexto() }}</span>
  }
</h2>

<mat-dialog-content>
  @if (data.items.length) {
    <div class="overflow-x-auto">
      <table mat-table [dataSource]="data.items" class="w-full min-w-[560px]">
        <ng-container matColumnDef="fecha">
          <th mat-header-cell *matHeaderCellDef>Fecha</th>
          <td mat-cell *matCellDef="let item">{{ item.fecha | dateShort }}</td>
        </ng-container>

        <ng-container matColumnDef="descripcion">
          <th mat-header-cell *matHeaderCellDef>Descripción</th>
          <td mat-cell *matCellDef="let item">{{ item.descripcion }}</td>
        </ng-container>

        <ng-container matColumnDef="categoria">
          <th mat-header-cell *matHeaderCellDef>Categoría</th>
          <td mat-cell *matCellDef="let item">{{ item.categoria }}</td>
        </ng-container>

        <ng-container matColumnDef="cuenta">
          <th mat-header-cell *matHeaderCellDef>Cuenta</th>
          <td mat-cell *matCellDef="let item">{{ item.cuenta }}</td>
        </ng-container>

        <ng-container matColumnDef="valor">
          <th mat-header-cell *matHeaderCellDef class="text-right">Valor</th>
          <td mat-cell *matCellDef="let item" class="text-right font-semibold tabular-nums">{{ item.valor | money }}</td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="columnas"></tr>
        <tr mat-row *matRowDef="let row; columns: columnas"></tr>
      </table>
    </div>
  } @else {
    <app-empty-state icon="search_off" message="Sin registros para este detalle" />
  }
</mat-dialog-content>

<mat-dialog-actions align="end">
  <span class="mr-auto text-sm text-mist-200">
    Total
    <span class="ml-1 text-base font-bold text-mist-50">{{ total() | money }}</span>
  </span>
  <button mat-flat-button color="primary" (click)="ref.close()">Cerrar</button>
</mat-dialog-actions>
