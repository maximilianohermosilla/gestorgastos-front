<div
  class="flex items-center gap-3 rounded-xl border border-white/5 bg-white/[0.03] p-3 transition-colors hover:border-white/10 hover:bg-white/[0.06]"
>
  @if (registro().categoriaGasto?.icono) {
    <span
      class="inline-flex h-9 w-9 shrink-0 cursor-help items-center justify-center rounded-full"
      [matTooltip]="registro().categoriaGasto?.nombre ?? ''"
      matTooltipPosition="right"
      [style.background-color]="registro().categoriaGasto?.color ?? '#1b4f3c'"
    >
      <mat-icon
        class="!h-5 !w-5 !text-lg leading-none"
        [style.color]="colorTexto(registro().categoriaGasto?.color)"
      >
        {{ registro().categoriaGasto?.icono }}
      </mat-icon>
    </span>
  } @else {
    <span
      class="inline-flex h-9 w-9 shrink-0 items-center justify-center rounded-full bg-mist-700/40 text-mist-300"
    >
      <mat-icon class="!h-5 !w-5 !text-lg leading-none">receipt_long</mat-icon>
    </span>
  }

  <div class="min-w-0 flex-1">
    <p class="truncate text-sm font-medium text-mist-50">{{ registro().descripcion }}</p>
    <p class="mt-0.5 truncate text-xs font-semibold text-mist-100">
      {{ registro().cuenta?.nombre ?? 'Sin cuenta' }}
    </p>
    <p class="truncate text-xs text-mist-300">{{ registro().fecha | dateShort }}</p>
  </div>

  <div class="flex shrink-0 flex-col items-end gap-1">
    <span class="text-sm font-bold tabular-nums" [class.text-income]="registro().pagado" [class.text-expense]="!registro().pagado">
      {{ registro().valor | money }}
    </span>

    <div class="flex items-center gap-0.5">
      <button
        mat-icon-button
        (click)="togglePagado.emit(registro())"
        [matTooltip]="registro().pagado ? 'Marcar como no pagado' : 'Marcar como pagado'"
        [attr.aria-label]="registro().pagado ? 'Marcar como no pagado' : 'Marcar como pagado'"
      >
        @if (registro().pagado) {
          <mat-icon class="icon-fill !text-income">check_circle</mat-icon>
        } @else {
          <mat-icon class="!text-mist-300">radio_button_unchecked</mat-icon>
        }
      </button>

      <button mat-icon-button (click)="editar.emit(registro())" matTooltip="Editar gasto" aria-label="Editar gasto">
        <mat-icon class="!text-accent">edit</mat-icon>
      </button>
    </div>
  </div>
</div>
