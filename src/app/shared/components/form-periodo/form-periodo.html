<div class="flex flex-wrap items-center gap-2">
  <button mat-icon-button (click)="anterior()" matTooltip="Anterior" aria-label="Periodo anterior">
    <mat-icon>chevron_left</mat-icon>
  </button>

  <mat-tab-group
    class="periodo__tabs"
    [selectedIndex]="selectedIndex()"
    (selectedIndexChange)="cambiarModo($event)"
    aria-label="Modo de periodo"
  >
    @if (!hiddenMonth()) {
      <mat-tab label="Mes">
        <mat-form-field appearance="fill" class="w-full">
          <mat-label>Periodo</mat-label>
          <input
            matInput
            [formControl]="mesCtrl"
            [matDatepicker]="dpMes"
            (dateChange)="onMesSelected($event)"
            (keydown.enter)="onEnterMes($event)"
          />
          <mat-datepicker-toggle matIconSuffix [for]="dpMes"></mat-datepicker-toggle>
          <mat-datepicker #dpMes startView="multi-year"></mat-datepicker>
        </mat-form-field>
      </mat-tab>
    }
    <mat-tab label="Año">
      <mat-form-field appearance="fill" class="w-full">
        <mat-label>Año</mat-label>
        <input
          matInput
          type="number"
          [formControl]="anioCtrl"
          (change)="onAnioChange($event)"
          (keydown.enter)="onEnterAnio($event)"
        />
      </mat-form-field>
    </mat-tab>
  </mat-tab-group>

  <button mat-icon-button (click)="siguiente()" matTooltip="Siguiente" aria-label="Periodo siguiente">
    <mat-icon>chevron_right</mat-icon>
  </button>
</div>
